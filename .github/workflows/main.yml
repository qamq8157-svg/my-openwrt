name: Build OpenWrt x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            python3

      - name: Clone OpenWrt
        run: |
          git clone --branch v24.10.8 --depth 1 https://github.com/openwrt/openwrt.git

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add DDNSTO
        working-directory: openwrt
        env:
          DDNSTO_TOKEN: ${{ secrets.DDNSTO_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/linkease/ddnsto-openwrt-package.git /tmp/ddnsto
          cp -r /tmp/ddnsto/ddnsto package/ddnsto

          python3 - <<'PY'
          import os

          token = os.environ["DDNSTO_TOKEN"]
          token = token.replace("\\", "\\\\").replace('"', '\\"')

          config = f"""config ddnsto
          option enabled '1'
          option token "{token}"
          option index '0'
          option logger '0'
          option feat_enabled '0'
          option feat_port '3033'
          """

          with open("package/ddnsto/files/ddnsto.config", "w") as f:
              f.write(config)
          PY

      - name: Add S5 package
        working-directory: openwrt
        env:
          S5_REPO_TOKEN: ${{ secrets.S5_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${S5_REPO_TOKEN}@github.com/qamq8157-svg/s5-package.git /tmp/s5-package

          mkdir -p package/s5/luci-app-s5-allocator-repair

          cp /tmp/s5-package/*.ipk package/s5/luci-app-s5-allocator-repair/

          cat > package/s5/luci-app-s5-allocator-repair/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=luci-app-s5-allocator-repair
          PKG_VERSION:=3.9.9-7
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/luci-app-s5-allocator-repair
            SECTION:=luci
            CATEGORY:=LuCI
            SUBMENU:=3. Applications
            TITLE:=S5 Allocator Repair
            DEPENDS:=+lua +libuci-lua +luci-base +luci-lua-runtime +luci-compat +xray-core +iptables
          endef

          define Package/luci-app-s5-allocator-repair/description
            S5 Allocator Repair
          endef

          define Build/Prepare
            mkdir -p $(PKG_BUILD_DIR)
            cd $(PKG_BUILD_DIR) && \
              ar x $(CURDIR)/S5-3.9.9-7-App勾选修复版.ipk
            cd $(PKG_BUILD_DIR) && \
              tar -xf data.tar.gz 2>/dev/null || \
              tar -xf data.tar.zst 2>/dev/null || \
              tar -xf data.tar.xz 2>/dev/null
          endef

          define Build/Compile
          endef

          define Package/luci-app-s5-allocator-repair/install
            cp -a $(PKG_BUILD_DIR)/* $(1)/
          endef

          $(eval $(call BuildPackage,luci-app-s5-allocator-repair))
          EOF

      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE
